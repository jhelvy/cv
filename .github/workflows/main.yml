name: Render Quarto PDF
on:
  push:
  schedule:
     # Scheduled to run at midnight EST (5:00 UTC) every Sunday
    - cron: '0 5 * * 0'
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_VERSION: '4.3.2'
      # R needs a UTF-8 locale, otherwise non-ASCII characters from the
      # Google sheet (e.g. the † postdoc marker) render as <U+2020>
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install ICU and other dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev libcurl4-openssl-dev

      - name: Record Ubuntu codename for the cache key
        run: echo "UBUNTU_CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")" >> "$GITHUB_ENV"

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Query R package dependencies
        run: |
          install.packages(c('remotes', 'here'))
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Cache R packages
        uses: actions/cache@v5
        with:
          path: ${{ env.R_LIBS_USER }}
          # The codename is part of the key because the cached packages are
          # binaries built for one Ubuntu release: restoring them onto a newer
          # ubuntu-latest image breaks them (e.g. xml2 linked to libxml2.so.2).
          key: ${{ runner.os }}-${{ env.UBUNTU_CODENAME }}-${{ env.R_VERSION }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ env.UBUNTU_CODENAME }}-${{ env.R_VERSION }}-1-

      - name: Install R dependencies
        run: |
          install.packages("stringi", configure.args = "--with-icudt-system=yes")
          remotes::install_deps(dependencies = TRUE)
        shell: Rscript {0}

      - name: Render PDF
        run: |
          quarto render helveston-cv.qmd --to pdf

      - name: Set up Git Config
        run: |
          git config --global user.name 'John Paul Helveston'
          git config --global user.email 'john.helveston@gmail.com'

      - name: Commit and Push PDF
        run: |
          git add helveston-cv.pdf
          git commit -m "Update rendered PDF" || echo "No changes to commit"
          git push